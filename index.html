/* =========================================================
   YARDIMCI FONKSİYONLAR
========================================================= */

function normalize(text){
return (text||"").trim().toLocaleLowerCase("tr-TR");
}

/* Bazı cevap metinleri kesme işareti (') içerebilir
   (örn. "Bluetooth'tan"). Bu metinleri tek tırnakla
   sınırlanmış bir HTML onclick niteliğinin içine güvenle
   yerleştirmek için JSON.stringify çıktısındaki tek
   tırnakları HTML varlığına çeviriyoruz. */

function jsAttr(text){
return JSON.stringify(text).replace(/'/g,"&#39;");
}

function shuffle(array){
const a=[...array];

for(let i=a.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}

return a;
}

function getCategory(id){
return CATEGORIES.find(c=>c.id===id);
}

function generateRoomCode(){
const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
let code="";

for(let i=0;i<5;i++){
code+=chars[Math.floor(Math.random()*chars.length)];
}

return code;
}

function slug(name){
return (name||"").trim().replace(/[^a-zA-Z0-9ÇĞİÖŞÜçğıöşü]/g,"_")||"oyuncu";
}

function roomKey(code,kind,round,name){
return "YALANCI_ROOM_"+code+"_"+kind+"_"+round+"_"+slug(name);
}

/*
  Firebase Realtime Database boş dizi/nesneleri ([] veya {})
  hiç saklamaz — o alanı tamamen siler. "usedQuestions" başta
  her kategori için boş bir dizi olduğundan, kaydedilir
  kaydedilmez Firebase tarafından silinir ve geri okuduğumuzda
  "undefined" olarak gelir. Firebase'den her oda verisi
  çektiğimizde bu fonksiyonla eksik alanları tamamlıyoruz ki
  kod hiçbir yerde "undefined" ile karşılaşıp çökmesin.
*/

function normalizeRoom(room){

if(!room) return room;

room.usedQuestions=room.usedQuestions||{};

CATEGORIES.forEach(c=>{

if(!Array.isArray(room.usedQuestions[c.id])){

room.usedQuestions[c.id]=[];

}

});

room.scores=room.scores||{};

room.players=room.players||[];

return room;

}


/* =========================================================

========================================================= */

function buildOptions(question,wrongAnswers){

const result=[];
const used=new Set();

for(const answer of wrongAnswers){

if(!answer) continue;

const normalized=normalize(answer);

if(normalized===normalize(question.correct)) continue;

if(used.has(normalized)) continue;

used.add(normalized);

result.push({
text:answer,
correct:false
});
}


/* Oyunculardan gelen yanlış cevaplar yetmezse
   oyunun kendi yanlış cevaplarını ekle */

for(const extra of shuffle(question.extra||[])){

if(result.length>=MIN_OPTIONS-1) break;

const normalized=normalize(extra);

if(normalized===normalize(question.correct)) continue;

if(used.has(normalized)) continue;

used.add(normalized);

result.push({
text:extra,
correct:false
});
}


/* DOĞRU CEVAP MUTLAKA SEÇENEKLERİN İÇİNDE */

result.push({
text:question.correct,
correct:true
});

return shuffle(result);
}

/* Her seçeneğin kimin yazdığı yanlış cevap olduğunu etiketler.
   Bu bilgi seçim sırasında kimseye gösterilmez — sadece tur
   sonunda "Cevaplar Açıklandı" bölümünde kullanılır. */

function attachOwners(options,wrongMap){

options.forEach(opt=>{

if(opt.correct){
opt.owners=[];
return;
}

opt.owners=Object.keys(wrongMap).filter(name=>
wrongMap[name] &&
normalize(wrongMap[name])===normalize(opt.text)
);

});

return options;

}

/* Tur sonunda gösterilen "kim ne yazdı" açıklama kutusu.
   choicesMap: {oyuncuAdı: seçtiği metin} */

function revealHTML(options,choicesMap){

const map=choicesMap||{};

const rows=(options||[]).map(opt=>{

const count=Object.values(map).filter(c=>c===opt.text).length;

let sub;

if(opt.correct){

sub=count>0
?
`${count} kişi doğruyu buldu → her biri +${POINTS_FOR_CORRECT} puan`
:
"Kimse bulamadı";

}else if(opt.owners && opt.owners.length){

sub=`${opt.owners.join(", ")} yazmıştı`+
(count>0
?
` · ${count} kişi seçti → +${POINTS_PER_VOTE} puan`
:
" · kimse seçmedi");

}else{

sub=count>0
?
`Oyunun eklediği sahte cevaptı · ${count} kişi kandı`
:
"Oyunun eklediği sahte cevaptı";

}

return`

<div class="lb-row reveal-row">

<div style="flex:1">

<div style="font-weight:700;${opt.correct?"color:var(--mint)":""}">
${opt.text}${opt.correct?" ✓":""}
</div>

<div class="reveal-sub">
${sub}
</div>

</div>

</div>

`;

}).join("");

return`

<div class="card">

<h3>Cevaplar Açıklandı</h3>

<div class="leaderboard">
${rows}
</div>

</div>

`;

}

num.textContent=timeLeft;

const pct=
timerTotal>0

(timeLeft/timerTotal)*100
:
100;

ring.style.setProperty(
"--pct",
pct
);

}

/*
  Oda durumu artık gerçek bir Firebase Realtime Database'de
  tutulur, bu yüzden herhangi bir cihazdan yapılan her
  storageSet, aynı odaya bağlı tüm cihazlar tarafından
  storageGet ile okunabilir. Firebase kurulmadıysa (yukarısı
  hâlâ "BURAYA_YAPISTIR" ise) fonksiyonlar null/false döner ve
  arayüz kullanıcıyı uyarır.
*/

let lastStorageError=null;

async function storageGet(key){

if(!firebaseReady) return null;

try{

const snap=await db.ref(key).once("value");

const val=snap.val();

return (val===null||val===undefined)?null:val;

}catch(e){

lastStorageError=(e && (e.code||e.message))||String(e);

console.error("storageGet hatası:",e);

return null;

}

}

async function storageSet(key,value){

if(!firebaseReady) return false;

try{

await db.ref(key).set(value);

return true;

}catch(e){

lastStorageError=(e && (e.code||e.message))||String(e);

console.error("storageSet hatası:",e);

return false;

}

}


/* =========================================================
   SORU BANKASI — FIREBASE İLE SENKRON
   =========================================================
   Sorular artık koddan değil, Firebase'deki "questions_data"
   düğümünden okunuyor. İlk açılışta Firebase boşsa, koddaki
   varsayılan CATEGORIES verisiyle bir kere doldurulur. Ondan
   sonra yönetici panelinden yapılan her değişiklik anında
   tüm cihazlara (canlı dinleyici sayesinde) yansır.
========================================================= */

function fbDataToCategories(data){

if(!data) return null;

const arr=Object.keys(data).map(catId=>{

const c=data[catId]||{};

const qMap=c.questions||{};

const questions=Object.keys(qMap).map(qid=>({

q:qMap[qid].q,

correct:qMap[qid].correct,

extra:qMap[qid].extra||[]

}));

return{

id:catId,

name:c.name||catId,

icon:c.icon||"❓",

questions:questions

};

});

return arr;

}

function categoryToFbShape(cat){

const questions={};

cat.questions.forEach((q,i)=>{

const qid="q"+i+"_"+Math.random().toString(36).slice(2,8);

questions[qid]={

q:q.q,

correct:q.correct,

extra:q.extra||[]

};

});

return{ name:cat.name, icon:cat.icon, questions:questions };

}

async function saveCategoriesToFirebase(){

if(!firebaseReady){

alert("Firebase ayarlı değil, değişiklikler kalıcı olarak kaydedilemiyor.");

return false;

}

const shaped={};

CATEGORIES.forEach(c=>{

shaped[c.id]=categoryToFbShape(c);

});

return await storageSet("questions_data",shaped);

}

async function initQuestionBank(){

if(!firebaseReady) return; // Firebase yoksa koddaki varsayılan sorular kullanılır

try{

const existing=await storageGet("questions_data");

if(!existing){

await saveCategoriesToFirebase();

}else{

const arr=fbDataToCategories(existing);

if(arr && arr.length) CATEGORIES=arr;

}

db.ref("questions_data").on("value",snap=>{

const val=snap.val();

const arr=fbDataToCategories(val);

if(arr && arr.length){

CATEGORIES=arr;

if(mode==="admin") renderAdminGame();

}

});

}catch(e){

console.error("Soru bankası yüklenemedi:",e);

}

}

function escapeAttr(s){

return (s||"").toString()

.replace(/&/g,"&amp;")

.replace(/"/g,"&quot;")

.replace(/</g,"&lt;");

}

function slugCategoryId(name){

const map={ç:"c",ğ:"g",ı:"i",ö:"o",ş:"s",ü:"u"};

let s=(name||"").trim().toLocaleLowerCase("tr-TR");

s=s.replace(/[çğıöşü]/g,ch=>map[ch]||ch);

s=s.replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"");

if(!s) s="kategori";

let base=s,i=1;

while(CATEGORIES.some(c=>c.id===s)){

i++;

s=base+"_"+i;

}

return s;

}

function readQuestionForm(prefix){

const q=(document.getElementById(prefix+"_q").value||"").trim();

const correct=(document.getElementById(prefix+"_correct").value||"").trim();

const extra=[1,2,3,4]

.map(i=>(document.getElementById(prefix+"_extra"+i).value||"").trim())

.filter(Boolean);

if(!q||!correct||extra.length<2){

alert("Soru metni, doğru cevap ve en az 2 yanlış seçenek girmelisin.");

return null;

}

return{ q, correct, extra };

}

async function createOnlineRoom(){

showOnlineSetupError("Önce Firebase ayarlarını tamamlamalısın (yukarıdaki uyarıya bak).");

return;

}

const name=
(document.getElementById("hostName").value||"").trim();

if(!name){

showOnlineSetupError("Adını gir.");

return;

}

onlineName=name;

roomCode=generateRoomCode();

isHost=true;

const usedQ={};

CATEGORIES.forEach(c=>{ usedQ[c.id]=[]; });

const room={
phase:"lobby",
host:name,
players:[name],
scores:{[name]:0},
round:0,
pickerIndex:0,
usedQuestions:usedQ,
categoryId:null,
question:null,
options:null,
roundChoices:null
};

roomState=room;

const ok=await storageSet(
"YALANCI_ROOM_"+roomCode,
room,
true
);

if(!ok){

roomState=null;

roomCode=null;

isHost=false;

showOnlineSetupError("Oda oluşturulamadı (Firebase'e yazma başarısız oldu). Teknik detay: "+(lastStorageError||"bilinmiyor")+" — Firebase Console > Realtime Database > Rules kısmını kontrol et.");

return;

}

startRoomPolling();

}

async function joinOnlineRoom(){

if(!firebaseReady){

showOnlineSetupError("Önce Firebase ayarlarını tamamlamalısın (yukarıdaki uyarıya bak).");

return;

}

const name=
(document.getElementById("joinName").value||"").trim();

const code=
(document.getElementById("joinCode").value||"")
.trim()
.toUpperCase();

if(!name||!code){

showOnlineSetupError("Ad ve oda kodunu gir.");

return;

}

const room=
normalizeRoom(await storageGet(
"YALANCI_ROOM_"+code,
true
));

if(!room){

showOnlineSetupError("Oda bulunamadı. Kodu kontrol et.");

return;

}

if(room.phase!=="lobby"){

showOnlineSetupError("Bu oyun zaten başladı.");

return;

}

if(!room.players.includes(name)){

room.players.push(name);

room.scores[name]=0;

const ok=await storageSet(
"YALANCI_ROOM_"+code,
room,
true
);

if(!ok){

showOnlineSetupError("Odaya katılamadın (Firebase'e yazma başarısız oldu). Teknik detay: "+(lastStorageError||"bilinmiyor")+" — Firebase Console > Realtime Database > Rules kısmını kontrol et.");

return;

}

}

onlineName=name;

roomCode=code;

isHost=false;

roomState=room;

startRoomPolling();

}

async function onlineSelectCategory(id){

try{

const room=roomState;

const category=getCategory(id);

const used=(room.usedQuestions||{})[id]||[];

const available=category.questions
.map((q,i)=>i)
.filter(i=>!used.includes(i));

if(!available.length) return;

const index=
available[Math.floor(Math.random()*available.length)];

used.push(index);

room.usedQuestions=room.usedQuestions||{};

room.usedQuestions[id]=used;

room.categoryId=id;

room.question={
...category.questions[index],
categoryName:category.name
};

room.options=null;

room.roundChoices=null;

room.phase="answering";

room.answeringStartedAt=Date.now();

const ok=await storageSet("YALANCI_ROOM_"+roomCode,room,true);

if(!ok){

alert("Kategori kaydedilemedi: Firebase'e yazma başarısız oldu. Teknik detay: "+(lastStorageError||"bilinmiyor"));

return;

}

roomState=room;

renderOnlineGame();

}catch(e){

console.error("onlineSelectCategory hatası:",e);

alert("Beklenmeyen bir hata oluştu: "+e.message);

}

}

<input type="text" id="answerInput" placeholder="Cevabını yaz..."
autocomplete="off"
onkeydown="if(event.key==='Enter')onlineSubmitFromInput()">

<button class="btn btn-primary" onclick="onlineSubmitFromInput()">
Cevabı Gönder
</button>

</div>

<p class="footnote">
${onlineLocalAnswerStage==="attempt1"?"İlk cevap · 30 saniye":"İkinci cevap · 20 saniye"}
— diğer oyuncular da aynı anda yazıyor.
</p>

</main>
`;

const input=document.getElementById("answerInput");

if(input) input.focus();

updateTimerDisplay();

}else if(onlineLocalAnswerStage==="correct1"||onlineLocalAnswerStage==="correct2"){

document.getElementById("app").innerHTML=`

${onlineTopbar()}
${onlineScoreBar()}

<main>

<div class="card pass-screen">

<div style="font-size:50px">🎯</div>

<h2 class="headline">Cevabınız doğru!</h2>

<p class="sub">
Başka bir cevap verin. Doğru cevabınız seçeneklere eklenmeyecek.
</p>

<button class="btn btn-primary"
onclick="${onlineLocalAnswerStage==='correct1'?'onlineGoSecondAnswer()':'onlineFinishAfterSecondCorrect()'}">
Devam Et
</button>

</div>

</main>
`;

}else{

document.getElementById("app").innerHTML=`

${onlineTopbar()}
${onlineScoreBar()}

<main>

<div class="card pass-screen">

<div style="font-size:40px">✅</div>

<h2 class="headline">Cevabın gönderildi</h2>

<p class="sub">Diğer oyuncular bekleniyor…</p>

</div>

</main>
`;

}

}

function onlineSubmitFromInput(){

const input=document.getElementById("answerInput");

onlineSubmitAnswer(input?input.value:"");

}

function onlineSubmitAnswer(text){

clearInterval(timer);

text=(text||"").trim();

const isCorrect=
text!=="" &&
normalize(text)===normalize(roomState.question.correct);

if(isCorrect){

onlineLocalAnswerStage=
onlineLocalAnswerStage==="attempt1"?"correct1":"correct2";

renderOnlineGame();

return;

}

onlineFinalizeAnswer(text||null);

}

function onlineGoSecondAnswer(){

onlineLocalAnswerStage="attempt2";

renderOnlineGame();

startTimer(ANSWER2_TIME,()=>onlineSubmitAnswer(""));

}

function onlineFinishAfterSecondCorrect(){

onlineFinalizeAnswer(null);

}

async function onlineFinalizeAnswer(wrongOrNull){

onlineMyWrong=wrongOrNull;

onlineLocalAnswerStage="waiting";

renderOnlineGame();

await storageSet(
roomKey(roomCode,"ans",roomState.round,onlineName),
{wrong:wrongOrNull},
true
);

}

function renderOnlineSelect(){

if(onlineLocalSelectStage==="selecting"){

const myOptions=(roomState.options||[]).filter(o=>
!(o.owners||[]).includes(onlineName)
);

const letters=["A","B","C","D","E","F","G"];

document.getElementById("app").innerHTML=`

${onlineTopbar()}
${onlineScoreBar()}

<main>

<div class="card">

<div class="stage-label">Doğruyu Bul</div>

<h2 class="headline" style="font-size:20px">${roomState.question.q}</h2>

<p class="sub">Doğru cevabı seç. Kendi yazdığın cevap burada görünmüyor.</p>

${
myOptions.map((o,i)=>`

<button class="option-btn" onclick='onlineChooseAnswer(${jsAttr(o.text)})'>
<span class="option-letter">${letters[i]}</span>
${o.text}
</button>

`).join("")
}

</div>

</main>
`;

}else{

document.getElementById("app").innerHTML=`

${onlineTopbar()}
${onlineScoreBar()}

<main>

<div class="card pass-screen">

<div style="font-size:40px">🗳️</div>

<h2 class="headline">Seçimin gönderildi</h2>

<p class="sub">Diğer oyuncular bekleniyor…</p>

</div>

</main>
`;

}

}

async function onlineChooseAnswer(text){

onlineMyChoice=text;

onlineLocalSelectStage="waiting";

renderOnlineGame();

await storageSet(
roomKey(roomCode,"cho",roomState.round,onlineName),
{choice:text},
true
);

}

function renderOnlineRoundResult(){

const sorted=[...roomState.players].sort(
(a,b)=>(roomState.scores[b]||0)-(roomState.scores[a]||0)
);

document.getElementById("app").innerHTML=`

${onlineTopbar()}
${onlineScoreBar()}

<main>

<div class="card" style="text-align:center">

<div class="stage-label">Tur Sonucu</div>

<h2 class="headline">Doğru cevap</h2>

<div style="font-size:28px;color:var(--gold);font-weight:800;margin-top:10px">
${roomState.question.correct}
</div>

</div>

${revealHTML(roomState.options,roomState.roundChoices)}

<div class="card">

<h3>Sıralama</h3>

${
sorted.map((p,i)=>`

<div class="lb-rank">${i+1}</div>

?

:
""
}

</div>

}

</div>

</div>

isHost
?

}

async function onlineNextRound(){

if(!isHost) return;

const room=roomState;

const remaining=CATEGORIES.some(
c=>(room.usedQuestions[c.id]||[]).length<c.questions.length
);

if(!remaining || room.round>=TOTAL_ROUNDS){

room.phase="game_over";

await storageSet("YALANCI_ROOM_"+roomCode,room,true);

roomState=room;

renderOnlineGame();

return;

}

room.round++;

room.pickerIndex=(room.pickerIndex+1)%room.players.length;

room.phase="category_pick";

await storageSet("YALANCI_ROOM_"+roomCode,room,true);

roomState=room;

renderOnlineGame();

}

function renderOnlineGameOver(){

const sorted=[...roomState.players].sort(
(a,b)=>(roomState.scores[b]||0)-(roomState.scores[a]||0)
);

document.getElementById("app").innerHTML=`

${onlineTopbar()}

<main>

<div class="card pass-screen">
<div style="font-size:60px">🏆</div>
<h1 class="headline">Oyun Bitti!</h1>
</div>

<div class="card">
<div class="leaderboard">

${
sorted.map((p,i)=>`

<div class="lb-row">
<div class="lb-rank">${i+1}</div>
<div class="lb-name">${p}</div>
<div class="lb-pts">${roomState.scores[p]||0}</div>
</div>

`).join("")
}

</div>
</div>

<button class="btn btn-primary" onclick="leaveOnlineRoom()">Ana Menü</button>

</main>
`;

}

function leaveOnlineRoom(){

if(roomPoll){ clearInterval(roomPoll); }

roomPoll=null;

clearInterval(timer);

roomCode=null;

isHost=false;

roomState=null;

onlineName="";

onlineLastRound=0;

onlineLocalAnswerStage="idle";

onlineMyWrong=null;

onlineLocalSelectStage="idle";

onlineMyChoice=null;

lastRoomSnapshot=null;

mode=null;

render();

}


/* =========================================================
   ONLINE POLLING
========================================================= */

function startRoomPolling(){

if(roomPoll){
clearInterval(roomPoll);
}

lastRoomSnapshot=null;

renderOnlineGame();

pollRoom();

roomPoll=setInterval(
pollRoom,
1200
);

}

/*
  Telefon kilitlenince veya uygulama arka plana atılınca
  tarayıcılar setInterval'i yavaşlatır/durdurur — bu yüzden
  ana ekran, ikinci oyuncu katılsa bile bunu göremeyebilir.
  Sekme/telefon tekrar aktif olduğu anda hemen bir kez daha
  sorgu atarak bunu düzeltiyoruz.
*/

let visibilityListenerAdded=false;

if(!visibilityListenerAdded){

document.addEventListener("visibilitychange",()=>{

if(document.visibilityState==="visible" && roomCode){

pollRoom();

}

});

visibilityListenerAdded=true;

}

function manualRefreshRoom(){

if(roomCode){

pollRoom();

}

}

async function pollRoom(){

if(!roomCode) return;

const room=
normalizeRoom(await storageGet(
"YALANCI_ROOM_"+roomCode,
true
));

if(!room) return;

roomState=room;

onlinePlayers=room.players||[];

onlineScores=room.scores||{};

if(room.round!==onlineLastRound){

onlineLastRound=room.round;

onlineLocalAnswerStage="idle";
onlineMyWrong=null;
onlineLocalSelectStage="idle";
onlineMyChoice=null;

}

if(isHost){

await hostMaybeAdvance();

}

let justEntered=false;

if(roomState.phase==="answering" && onlineLocalAnswerStage==="idle"){

onlineLocalAnswerStage="attempt1";

justEntered=true;

}

if(roomState.phase==="select" && onlineLocalSelectStage==="idle"){

onlineLocalSelectStage="selecting";

justEntered=true;

}

const stageBusy=
onlineLocalAnswerStage==="attempt1"||
onlineLocalAnswerStage==="attempt2";

const snapshot=JSON.stringify({

r:roomState,

a:onlineLocalAnswerStage,

s:onlineLocalSelectStage

});

const changed=snapshot!==lastRoomSnapshot;

if(justEntered || (!stageBusy && changed)){

renderOnlineGame();

lastRoomSnapshot=snapshot;

}

if(justEntered && roomState.phase==="answering"){

startTimer(ANSWER1_TIME,()=>onlineSubmitAnswer(""));

}

}

async function hostMaybeAdvance(){

const room=roomState;

if(!room) return;

/* Bir oyuncu bir sebeple hiç cevap/seçim göndermezse
   (uygulamayı kapattı, bağlantısı koptu, vb.) oyun sonsuza
   kadar onu beklemesin diye bir üst zaman sınırı koyuyoruz.
   Süre dolunca, cevap vermeyenler o turda "cevapsız" kabul
   edilip oyun devam eder. */

const ANSWER_PHASE_TIMEOUT_MS=(ANSWER1_TIME+ANSWER2_TIME+15)*1000;

const SELECT_PHASE_TIMEOUT_MS=45*1000;

if(room.phase==="answering"){

const wrongMap={};

let allIn=true;

for(const name of room.players){

const a=await storageGet(
roomKey(roomCode,"ans",room.round,name),
true
);

if(a){
wrongMap[name]=a.wrong;
}else{
allIn=false;
}

}

const timedOut=
room.answeringStartedAt &&
(Date.now()-room.answeringStartedAt>ANSWER_PHASE_TIMEOUT_MS);

if(allIn||timedOut){

room.players.forEach(name=>{
if(!(name in wrongMap)) wrongMap[name]=null;
});

room.options=attachOwners(
buildOptions(room.question,Object.values(wrongMap)),
wrongMap
);

room.phase="select";

room.selectStartedAt=Date.now();

await storageSet("YALANCI_ROOM_"+roomCode,room,true);

roomState=room;

}

}else if(room.phase==="select"){

const choiceMap={};

let allIn=true;

for(const name of room.players){

const c=await storageGet(
roomKey(roomCode,"cho",room.round,name),
true
);

if(c){
choiceMap[name]=c.choice;
}else{
allIn=false;
}

}

const timedOut=
room.selectStartedAt &&
(Date.now()-room.selectStartedAt>SELECT_PHASE_TIMEOUT_MS);

if(allIn||timedOut){

const gains={};

room.players.forEach(name=>{

const choiceText=choiceMap[name];

if(choiceText===undefined) return; // hiç seçim yapmadı, puan yok

const opt=(room.options||[]).find(o=>o.text===choiceText);

if(!opt) return;

if(opt.correct){

room.scores[name]=(room.scores[name]||0)+POINTS_FOR_CORRECT;

gains[name]=(gains[name]||0)+POINTS_FOR_CORRECT;

}else if(opt.owners && opt.owners.length){

opt.owners.forEach(owner=>{

if(owner!==name){
room.scores[owner]=(room.scores[owner]||0)+POINTS_PER_VOTE;
gains[owner]=(gains[owner]||0)+POINTS_PER_VOTE;
}

});

}

});

room.roundChoices=choiceMap;

room.lastGain=gains;

room.phase="round_result";

await storageSet("YALANCI_ROOM_"+roomCode,room,true);

roomState=room;

}

}

}

}
