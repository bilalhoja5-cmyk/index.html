<!DOCTYPE html><html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>YALANCI — Bilgi ve Blöf Oyunu</title><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.13.0/firebase-app-compat.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.13.0/firebase-database-compat.min.js"></script><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{
  --bg:#0a0f20;
  --bg-deep:#05070f;
  --panel:#131c39;
  --panel-2:#1c2954;
  --line:rgba(226,235,255,.09);
  --line-strong:rgba(226,235,255,.2);

  /* Truth vs Bluff — the game's core duality, used as the
     backbone of the whole color system rather than one
     generic accent. Blue = trust / correct / primary
     actions. Pink = mischief / bluffing / secondary accent. */
  --coral:#3d7bff;
  --coral-dim:#2f5fd1;
  --bluff:#ff4f7d;
  --bluff-dim:#e0396a;
  --gold:#ffc857;
  --gold-hi:#ffdd8c;
  --mint:#4ade80;
  --danger:#ff5252;

  --ink:#f2f5ff;
  --ink-dim:#8ea0c9;
  --ink-faint:#57638c;

  --radius:20px;
  --radius-lg:28px;
  --radius-sm:12px;
  --radius-pill:999px;

  --ease:cubic-bezier(.22,.9,.3,1);
  --dur-fast:.15s;
  --dur:.3s;
  --dur-slow:.55s;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{height:100%}

body{
  margin:0;
  background:
    radial-gradient(ellipse 90% 55% at 18% -8%,#1c3fa8 0%,transparent 55%),
    radial-gradient(ellipse 65% 45% at 105% 18%,#ff4f7d1f 0%,transparent 50%),
    var(--bg);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  justify-content:center;
  -webkit-font-smoothing:antialiased;
}

#app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  padding-bottom:max(28px,env(safe-area-inset-bottom));
  padding-top:env(safe-area-inset-top);
  position:relative;
}

h1,h2,h3{
  font-family:'Bricolage Grotesque',sans-serif;
  margin:0;
  letter-spacing:-.01em;
}

h3{
  font-size:15px;
  font-weight:800;
  color:var(--ink-dim);
  text-transform:none;
  margin-bottom:2px;
}

::selection{background:var(--coral);color:#fff}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 20px 8px;
}

.brand{
  font-family:'Bricolage Grotesque',sans-serif;
  font-weight:800;
  font-size:19px;
  letter-spacing:-.01em;
  display:flex;
  align-items:center;
  gap:7px;
}

.brand .dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--bluff);
  box-shadow:0 0 10px var(--bluff);
  flex:none;
}

.round-pill{
  font-size:12.5px;
  font-weight:600;
  color:var(--ink-dim);
  background:var(--panel);
  border:1px solid var(--line);
  padding:6px 13px;
  border-radius:var(--radius-pill);
  white-space:nowrap;
}

.leave-link{
  font-size:12px;
  color:var(--ink-dim);
  text-decoration:none;
  background:none;
  border:none;
  cursor:pointer;
  padding:6px 4px;
  transition:color var(--dur-fast) var(--ease);
}

.leave-link:active{color:var(--danger)}

.scorebar{
  display:flex;
  gap:8px;
  padding:2px 20px 16px;
  overflow-x:auto;
  scrollbar-width:none;
}

.scorebar::-webkit-scrollbar{display:none}

.score-chip{
  flex:1;
  min-width:72px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  padding:9px 10px 10px;
  text-align:center;
}

.score-chip .nm{
  font-size:12px;
  font-weight:600;
  color:var(--ink-dim);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.score-chip .pt{
  font-family:'Bricolage Grotesque',sans-serif;
  font-weight:800;
  font-size:19px;
  color:var(--gold);
  margin-top:1px;
}

main{
  flex:1;
  padding:6px 20px 24px;
  display:flex;
  flex-direction:column;
  gap:16px;
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:22px 20px;
  animation:card-in var(--dur-slow) var(--ease);
}

@keyframes card-in{
  from{opacity:0;transform:translateY(10px) scale(.98)}
  to{opacity:1;transform:none}
}

.stage-label{
  font-size:13px;
  color:var(--bluff);
  font-weight:700;
  margin-bottom:6px;
}

.headline{
  font-weight:800;
  font-size:25px;
  line-height:1.22;
  letter-spacing:-.01em;
}

.recap-question{
  font-family:'Bricolage Grotesque',sans-serif;
  font-weight:700;
  font-size:18px;
  line-height:1.35;
  color:var(--ink);
  padding:12px 14px;
  background:var(--bg-deep);
  border-radius:var(--radius-sm);
  border-left:3px solid var(--bluff);
}

.sub{
  color:var(--ink-dim);
  font-size:15px;
  line-height:1.55;
}

/* ===== HOME HERO ===== */

.hero{
  text-align:center;
  padding:20px 4px 6px;
}

.hero-wordmark{
  font-family:'Bricolage Grotesque',sans-serif;
  font-weight:800;
  font-size:14px;
  letter-spacing:.34em;
  color:var(--bluff);
  margin-bottom:16px;
}

.hero-line{
  font-family:'Bricolage Grotesque',sans-serif;
  font-weight:800;
  font-size:clamp(30px,9vw,38px);
  line-height:1.14;
  letter-spacing:-.02em;
}

.hero-sub{
  color:var(--ink-dim);
  font-size:15px;
  line-height:1.55;
  margin-top:14px;
  padding:0 6px;
}

.mode-stack{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-top:8px;
}

.mode-tile{
  width:100%;
  text-align:left;
  background:var(--panel);
  border:1.5px solid var(--line);
  border-left:4px solid var(--coral);
  border-radius:var(--radius-lg);
  padding:20px;
  cursor:pointer;
  color:var(--ink);
  transition:transform var(--dur-fast) var(--ease);
  animation:card-in var(--dur-slow) var(--ease);
}

.mode-tile:active{transform:scale(.98)}

.mode-tile-gold{border-left-color:var(--gold)}

.mode-tile-top{
  display:flex;
  align-items:center;
  gap:14px;
}

.mode-tile-icon{
  font-size:28px;
  flex:none;
  width:52px;
  height:52px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--bg-deep);
  border-radius:var(--radius-sm);
}

.mode-tile-title{
  font-family:'Bricolage Grotesque',sans-serif;
  font-weight:800;
  font-size:18px;
}

.mode-tile-desc{
  font-size:13.5px;
  color:var(--ink-dim);
  margin-top:2px;
  line-height:1.4;
}

/* ===== QUESTION — HERO SCREEN ===== */

.question-card{
  background:
    radial-gradient(circle at 100% 0%,#3d7bff22 0%,transparent 45%),
    linear-gradient(165deg,var(--panel-2),var(--panel) 65%);
  border:1px solid var(--line-strong);
  border-left:4px solid var(--coral);
  border-radius:var(--radius-lg);
  padding:26px 22px 24px;
  position:relative;
  overflow:hidden;
  animation:question-in var(--dur-slow) var(--ease);
}

@keyframes question-in{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:none}
}

.question-cat{
  font-size:12.5px;
  color:var(--gold);
  font-weight:700;
  margin-bottom:12px;
}

.question-text{
  font-family:'Bricolage Grotesque',sans-serif;
  font-size:clamp(21px,6vw,25px);
  font-weight:700;
  line-height:1.32;
  letter-spacing:-.01em;
}

.word-hint{
  font-family:'Inter',sans-serif;
  font-size:13.5px;
  font-weight:600;
  color:var(--ink-dim);
  opacity:.8;
}

.timer-wrap{
  display:flex;
  align-items:center;
  justify-content:center;
  margin:20px 0 2px;
}

.timer-ring{
  width:76px;
  height:76px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:800;
  font-family:'Bricolage Grotesque',sans-serif;
  background:conic-gradient(
    var(--coral) calc(var(--pct)*1%),
    var(--panel-2) 0
  );
}

.timer-ring.timer-urgent{
  background:conic-gradient(
    var(--danger) calc(var(--pct)*1%),
    var(--panel-2) 0
  );
  animation:timer-pulse .6s ease-in-out infinite;
}

@keyframes timer-pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.07)}
}

.timer-ring .inner{
  width:60px;
  height:60px;
  border-radius:50%;
  background:var(--bg-deep);
  display:flex;
  align-items:center;
  justify-content:center;
}

.timer-ring.timer-urgent .inner{color:var(--danger)}

input[type=text]{
  width:100%;
  background:var(--bg-deep);
  border:1.5px solid var(--line);
  color:var(--ink);
  border-radius:var(--radius-sm);
  padding:15px 16px;
  font-size:16px;
  font-family:'Inter',sans-serif;
  outline:none;
  margin-top:14px;
  transition:border-color var(--dur-fast) var(--ease);
}

input[type=text]:focus{
  border-color:var(--coral);
}

input[type=text]::placeholder{
  color:var(--ink-dim);
  opacity:.65;
}

.btn{
  display:block;
  width:100%;
  text-align:center;
  border:none;
  border-radius:var(--radius-sm);
  padding:16px 18px;
  font-size:16px;
  font-weight:800;
  font-family:'Inter',sans-serif;
  cursor:pointer;
  margin-top:12px;
  transition:transform var(--dur-fast) var(--ease),box-shadow var(--dur-fast) var(--ease),opacity var(--dur-fast) var(--ease);
}

.btn:active{transform:scale(.97)}

.btn-primary{
  background:var(--coral);
  color:#fff;
  box-shadow:0 6px 20px -8px #3d7bffaa;
}

.btn-gold{
  background:linear-gradient(135deg,var(--gold-hi),var(--gold));
  color:#2a1d00;
  box-shadow:0 6px 20px -8px #ffc857aa;
}

.btn-ghost{
  background:transparent;
  border:1.5px solid var(--line-strong);
  color:var(--ink);
}

.btn:disabled{
  opacity:.35;
  transform:none;
  box-shadow:none;
}

.option-btn{
  display:flex;
  align-items:center;
  gap:13px;
  width:100%;
  text-align:left;
  background:var(--bg-deep);
  border:1.5px solid var(--line);
  color:var(--ink);
  border-radius:var(--radius-sm);
  padding:16px;
  font-size:16px;
  font-weight:500;
  margin-top:10px;
  cursor:pointer;
  transition:transform var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease),background var(--dur-fast) var(--ease);
}

.option-btn:active{
  transform:scale(.98);
  border-color:var(--coral);
  background:var(--panel-2);
}

.option-letter{
  width:30px;
  height:30px;
  border-radius:var(--radius-sm);
  background:var(--panel-2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:14px;
  color:var(--ink-dim);
  flex-shrink:0;
}

.pass-screen{
  text-align:center;
  padding:48px 20px;
  animation:card-in var(--dur-slow) var(--ease);
}

.gameover-card{
  text-align:center;
  padding:42px 20px 36px;
  background:
    radial-gradient(circle at 50% 0%,#ffc85740 0%,transparent 60%),
    var(--panel);
  border-color:#ffc85755;
  position:relative;
  overflow:hidden;
}

.gameover-trophy{
  font-size:60px;
  animation:trophy-bounce 1.8s ease-in-out infinite;
  filter:drop-shadow(0 0 20px #ffc85788);
  display:inline-block;
}

@keyframes trophy-bounce{
  0%,100%{transform:translateY(0) rotate(-3deg)}
  50%{transform:translateY(-9px) rotate(3deg)}
}

.gameover-winner{
  font-family:'Bricolage Grotesque',sans-serif;
  font-weight:800;
  font-size:23px;
  color:var(--gold-hi);
  margin-top:8px;
}

.confetti{
  position:absolute;
  top:-12px;
  width:7px;
  height:13px;
  opacity:0;
  animation:confetti-fall 2.4s ease-in forwards;
}

@keyframes confetti-fall{
  0%{opacity:1;transform:translateY(0) rotate(0deg)}
  100%{opacity:0;transform:translateY(220px) rotate(340deg)}
}

.avatar{
  width:80px;
  height:80px;
  border-radius:var(--radius);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  margin:0 auto 16px;
}

.cat-grid{
  display:flex;
  flex-direction:column;
  gap:9px;
  margin-top:14px;
}

.cat-btn{
  display:flex;
  align-items:center;
  gap:14px;
  width:100%;
  background:var(--bg-deep);
  border:1.5px solid var(--line);
  border-radius:var(--radius-sm);
  padding:15px 16px;
  color:var(--ink);
  font-weight:700;
  font-size:16px;
  cursor:pointer;
  transition:transform var(--dur-fast) var(--ease);
}

.cat-btn:active{transform:scale(.98)}

.cat-btn:disabled{opacity:.3}

.cat-btn-selected{
  border-color:var(--coral);
  background:#3d7bff1a;
}

.time-choice-row{
  display:flex;
  gap:9px;
  margin-top:8px;
}

.cat-icon{font-size:24px}

.cat-left{
  font-size:12px;
  color:var(--ink-dim);
  margin-left:auto;
  font-weight:600;
}

.leaderboard{
  margin-top:14px;
  display:flex;
  flex-direction:column;
  gap:9px;
}

.lb-row{
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--bg-deep);
  border:1.5px solid var(--line);
  border-radius:var(--radius-sm);
  padding:13px 14px;
  position:relative;
  overflow:hidden;
}

.lb-row-gold{
  border-color:var(--gold);
  background:linear-gradient(120deg,#3a2f0f,var(--bg-deep) 60%);
  box-shadow:0 0 24px -6px #ffc85788;
  transform:scale(1.02);
}

.lb-row-silver{
  border-color:#cbd5e1;
  background:linear-gradient(120deg,#2a3040,var(--bg-deep) 60%);
  box-shadow:0 0 16px -8px #cbd5e166;
}

.lb-row-bronze{
  border-color:#d98a4a;
  background:linear-gradient(120deg,#3a2515,var(--bg-deep) 60%);
  box-shadow:0 0 16px -8px #d98a4a55;
}

.lb-rank{
  width:30px;
  height:30px;
  border-radius:var(--radius-sm);
  background:var(--panel-2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:14px;
  flex:none;
}

.lb-rank-gold{
  background:linear-gradient(145deg,var(--gold-hi),#e8a318);
  color:#332000;
  font-size:18px;
}

.lb-rank-silver{
  background:linear-gradient(145deg,#eef2f8,#a9b6c7);
  color:#1c2534;
  font-size:18px;
}

.lb-rank-bronze{
  background:linear-gradient(145deg,#e2995c,#a85e2c);
  color:#2a1400;
  font-size:18px;
}

.lb-name{
  flex:1;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}

.lb-delta{
  color:var(--mint);
  font-size:12px;
  font-weight:700;
  animation:delta-pop .5s var(--ease);
}

@keyframes delta-pop{
  from{opacity:0;transform:translateY(4px) scale(.8)}
  to{opacity:1;transform:none}
}

.lb-pts{
  font-weight:800;
  font-size:18px;
  color:var(--gold);
  font-family:'Bricolage Grotesque',sans-serif;
}

.lb-pts-gold{
  font-size:23px;
  color:var(--gold-hi);
  text-shadow:0 0 14px #ffc85799;
}

.footnote{
  font-size:12px;
  color:var(--ink-dim);
  text-align:center;
  margin-top:12px;
  line-height:1.5;
}

.answer-notice{
  background:#164d3d;
  color:var(--mint);
  border:1px solid #4ade8033;
  border-radius:var(--radius-sm);
  padding:13px 14px;
  font-weight:700;
  font-size:14px;
  text-align:center;
  margin:12px 0;
  line-height:1.5;
  animation:card-in var(--dur) var(--ease);
}

.field-label{
  display:block;
  font-size:12.5px;
  font-weight:700;
  color:var(--ink-dim);
  margin:14px 0 6px;
}

.player-input-row{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.player-input-row input{
  margin-top:0;
}

.remove-btn{
  width:46px;
  flex:none;
  border:none;
  border-radius:var(--radius-sm);
  background:var(--bluff-dim);
  color:#fff;
  cursor:pointer;
  font-size:18px;
  transition:transform var(--dur-fast) var(--ease);
}

.remove-btn:active{transform:scale(.92)}

.player-list{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-top:14px;
}

.player-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:11px 12px;
  border-radius:var(--radius-sm);
  background:var(--bg-deep);
  border:1px solid var(--line);
}

.avatar-mini{
  width:30px;
  height:30px;
  border-radius:var(--radius-sm);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  flex:none;
}

.avatar-picker{
  margin-top:14px;
  padding:16px;
  border-radius:var(--radius);
  background:var(--bg-deep);
  border:1.5px solid var(--line);
}

.avatar-picker-preview{
  width:58px;
  height:58px;
  border-radius:var(--radius-sm);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  margin:0 auto 14px;
}

.avatar-picker-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:8px;
}

.avatar-choice{
  aspect-ratio:1;
  border-radius:var(--radius-sm);
  border:1.5px solid var(--line);
  background:var(--panel);
  font-size:18px;
  cursor:pointer;
  transition:transform var(--dur-fast) var(--ease);
}

.avatar-choice:active{transform:scale(.9)}

.avatar-choice-selected{
  border-color:var(--coral);
  background:#3d7bff22;
}

.avatar-picker-colors{
  display:flex;
  gap:9px;
  margin-top:12px;
  justify-content:center;
}

.avatar-color-choice{
  width:27px;
  height:27px;
  border-radius:50%;
  border:2px solid transparent;
  cursor:pointer;
  padding:0;
  transition:transform var(--dur-fast) var(--ease);
}

.avatar-color-choice:active{transform:scale(.85)}

.avatar-color-selected{
  border-color:var(--ink);
  box-shadow:0 0 0 2px var(--bg-deep),0 0 0 3px var(--ink);
}

.qr-wrap{
  display:flex;
  justify-content:center;
  margin:18px 0;
}

#qrcode{
  background:white;
  padding:12px;
  border-radius:var(--radius-sm);
  box-shadow:0 12px 30px -10px #00000066;
}

.code-box{
  font-size:32px;
  font-weight:800;
  font-family:'Bricolage Grotesque',sans-serif;
  letter-spacing:.14em;
  text-align:center;
  color:var(--gold);
  background:var(--bg-deep);
  border:1.5px dashed var(--gold);
  border-radius:var(--radius-sm);
  padding:15px;
  flex:1;
}

.code-box-row{
  display:flex;
  align-items:stretch;
  gap:8px;
}

.copy-code-btn{
  flex:none;
  width:80px;
  background:var(--panel-2);
  border:1.5px solid var(--line);
  color:var(--ink);
  border-radius:var(--radius-sm);
  font-size:12.5px;
  font-weight:700;
  cursor:pointer;
  white-space:normal;
  line-height:1.3;

/* Metni karşılaştırmaya hazır hale getirir:
   - baş/son boşlukları temizler
   - birden fazla boşluğu teke indirir
   - basit noktalama işaretlerini yok sayar (. , ! ? : ; ' " - / ( ))
   - Türkçe'ye özgü doğru harf küçültme kuralını kullanır
     (İ→i, I→ı — toLocaleLowerCase("tr-TR") bunu doğru yapar,
     genel .toLowerCase() YANLIŞ yapardı). */
function normalize(text){

return (text||"")
.trim()
.replace(/[.,!?:;'"\-\/()]/g,"")
.replace(/\s+/g," ")
.trim()
.toLocaleLowerCase("tr-TR");

}

/* =========================================================
   MERKEZİ CEVAP DOĞRULAMA SİSTEMİ
   (isAnswerCorrect — tüm oyunda TEK doğruluk kaynağı)
========================================================= */

/* İki metin arasındaki Levenshtein (düzenleme) mesafesini
   hesaplar — küçük yazım farklarını (örn. "ahmet" / "ahmed")
   tolere edebilmek için. */
function levenshteinDistance(a,b){

const m=a.length, n=b.length;

if(m===0) return n;
if(n===0) return m;

let prev=Array.from({length:n+1},(_,i)=>i);

for(let i=1;i<=m;i++){

const curr=[i];

for(let j=1;j<=n;j++){

const cost=a[i-1]===b[j-1]?0:1;

curr[j]=Math.min(
prev[j]+1,
curr[j-1]+1,
prev[j-1]+cost
);

}

prev=curr;

}

return prev[n];
}

/* Metnin başındaki sayıyı ayıklar (örn. "12 dakika" -> "12").
   Birim toleransı için kullanılır: doğru cevap "12 dakika"
   olsa bile oyuncu sadece "12" yazarsa doğru sayılır. */
function leadingNumber(text){

const m=(text||"").trim().match(/^-?\d+([.,]\d+)?/);

return m?m[0].replace(",","."):null;

}

   3) Küçük yazım hatası toleransı — SADECE kelime bazlı
      cevaplar için, sayısal cevaplar için asla. Yanlış
      pozitifleri önlemek için cevap ne kadar kısaysa eşik o
      kadar sıkı: 3 karaktere kadar tolerans YOK (tek harf
      farkı kısa kelimelerde neredeyse her zaman başka,
      geçerli bir kelime/isim anlamına gelir — "Muş"/"Kuş"
      gibi), 4-7 karakterde en fazla 1 harf farkı, 8+ karakterde
      en fazla 2 harf farkı. Anlamca/telaffuzca yakın ama
      yazılışça uzak kelimeler ASLA kabul edilmez, çünkü bu
      "yazım hatası" değil "farklı cevap" demektir. */
function fuzzyTextMatch(a,b){

if(!a) return false;
if(a===b) return true;

const numA=leadingNumber(a);
const numB=leadingNumber(b);

const bIsPureNumber=numB!==null && b.slice(numB.length).trim()==="";

if(bIsPureNumber){

/* Doğru cevap sayısalsa: sadece birebir aynı sayı (birim
   fark etmeksizin) kabul edilir. Yazım hatası toleransı
   sayılara KESİNLİKLE uygulanmaz. */
return numA!==null && numA===numB;

}

if(numA!==null && numB!==null && numA===numB){

const restA=a.slice(numA.length).trim();
const restB=b.slice(numB.length).trim();

/* İkisinden biri sadece sayıdan oluşuyorsa (birim
   eklenmemişse) eşleşmiş say. */
if(!restA || !restB) return true;

}

/* Herhangi bir taraf tamamen sayısalsa ve yukarıdaki
   durumların hiçbirine girmediyse, kelime bazlı yazım
   hatası toleransı uygulanmaz. */
const aIsFullyNumeric=/^\d+([.,]\d+)?$/.test(a);
const bIsFullyNumeric=/^\d+([.,]\d+)?$/.test(b);

if(aIsFullyNumeric||bIsFullyNumeric) return false;

const maxLen=Math.max(a.length,b.length);

if(maxLen===0) return false;

/* Kısa cevaplarda (≤3 karakter) yazım hatası toleransı
   tamamen kapalı — yanlış pozitif riski çok yüksek. */
if(maxLen<=3) return false;

const distance=levenshteinDistance(a,b);

const threshold=
maxLen<=7?1:
2;

return distance<=threshold;

}

/* OYUNDAKİ TEK DOĞRULUK KAYNAĞI: bir oyuncunun yazdığı
   cevabın, verilen soru için doğru sayılıp sayılmayacağına
   karar verir. question.correct ile ve (varsa) her
   question.aliases[] öğesiyle karşılaştırır — herhangi biriyle
   eşleşirse doğru kabul edilir. Local ve Online oyunun HER
   YERİNDE bu fonksiyon kullanılır, böylece iki mod arasında
   asla tutarsızlık olmaz. */
function isAnswerCorrect(userAnswer,question){

if(!question) return false;

const a=normalize(userAnswer);

if(!a) return false;

const candidates=[question.correct,...(question.aliases||[])]
.filter(Boolean);

return candidates.some(c=>fuzzyTextMatch(a,normalize(c)));

}

/* Geriye dönük uyumluluk için: iki ham metni doğrudan
   karşılaştırmak isteyen eski çağrılar hâlâ çalışsın diye
   ince bir sarmalayıcı (alias desteği olmadan, tek bir
   doğru metne karşı). Yeni kod isAnswerCorrect() kullanmalı. */
function answersMatch(userText,correctText){
return fuzzyTextMatch(normalize(userText),normalize(correctText));
}

/* Soru metninin yanına, beklenen cevabın türüne göre küçük
   bir ipucu ekler:
   - Doğru cevap sayısalsa (birim olsa da olmasa da,
     örn. "12" ya da "12 dakika"): "(Cevap bir sayı)"
   - Değilse, kaç kelimeden oluştuğunu gösterir:
     "(Cevap 2 kelime)" */
function answerWordHint(question){

const correct=(question&&question.correct)||"";

const trimmed=correct.trim();

const num=leadingNumber(trimmed);

const isNumericAnswer=
num!==null && /^\d/.test(trimmed);

if(isNumericAnswer){

return ` <span class="word-hint">(Cevap bir sayı)</span>`;

}

const count=trimmed
.split(/\s+/)
.filter(Boolean)
.length;

return count>0
?` <span class="word-hint">(Cevap ${count} kelime)</span>`
:"";

}

/* Bazı cevap metinleri kesme işareti (') içerebilir
   (örn. "Bluetooth'tan"). Bu metinleri tek tırnakla
   sınırlanmış bir HTML onclick niteliğinin içine güvenle
   yerleştirmek için JSON.stringify çıktısındaki tek
   tırnakları HTML varlığına çeviriyoruz. */

function jsAttr(text){
return JSON.stringify(text).replace(/'/g,"&#39;");
}

function shuffle(array){
const a=[...array];

for(let i=a.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}

return a;
}

/* Oyun bitince kazanma anını hafif ve performanslı bir
   şekilde kutlamak için birkaç CSS-only konfeti parçası
   üretir (JS animasyon kütüphanesi yok — sadece CSS
   keyframes, tek seferlik ve otomatik biter). */
function confettiHTML(){

const colors=["var(--gold)","var(--coral)","var(--bluff)","var(--mint)"];

let out="";

for(let i=0;i<14;i++){

const left=Math.round(Math.random()*100);
const color=colors[i%colors.length];
const delay=(Math.random()*.5).toFixed(2);
const rot=Math.round(Math.random()*40-20);

out+=`<div class="confetti" style="left:${left}%;background:${color};animation-delay:${delay}s;transform:rotate(${rot}deg)"></div>`;

}

return out;
}

/* Bir oyuncunun avatarını döndürür (emoji+renk). Kayıtlı
   avatarı yoksa (eski oda verisi, vb.) güvenli bir varsayılan
   döner ki hiçbir yerde "undefined" ile karşılaşılmasın. */
function avatarFor(name,avatarsMap){
return (avatarsMap&&avatarsMap[name])||
{emoji:"👤",color:"#3d7bff"};
}

let code="";

for(let i=0;i<5;i++){
code+=chars[Math.floor(Math.random()*chars.length)];

return code;
}

return (name||"").trim().replace(/[^a-zA-Z0-9ÇĞİÖŞÜçğıöşü]/g,"_")||"oyuncu";
}

/*
  Firebase Realtime Database boş dizi/nesneleri ([] veya {})
  hiç saklamaz — o alanı tamamen siler. "usedQuestions" başta
  her kategori için boş bir dizi olduğundan, kaydedilir
  kaydedilmez Firebase tarafından silinir ve geri okuduğumuzda
  "undefined" olarak gelir. Firebase'den her oda verisi
  çektiğimizde bu fonksiyonla eksik alanları tamamlıyoruz ki
  kod hiçbir yerde "undefined" ile karşılaşıp çökmesin.
*/

function normalizeRoom(room){

if(!room) return room;

room.usedQuestions=room.usedQuestions||{};

CATEGORIES.forEach(c=>{

if(!Array.isArray(room.usedQuestions[c.id])){

room.usedQuestions[c.id]=[];

}

});

room.scores=room.scores||{};

room.players=room.players||[];

room.avatars=room.avatars||{};

room.selectedCategoryIds=
(Array.isArray(room.selectedCategoryIds)&&room.selectedCategoryIds.length)
?room.selectedCategoryIds
:CATEGORIES.map(c=>c.id);

room.questionTime=room.questionTime||45;

return room;

}


/* =========================================================
   OPTIONS OLUŞTURMA
========================================================= */

function buildOptions(question,wrongAnswers){

const result=[];
const used=new Set();

for(const answer of wrongAnswers){

if(!answer) continue;

const normalized=normalize(answer);

if(isAnswerCorrect(answer,question)) continue;

if(used.has(normalized)) continue;

used.add(normalized);

result.push({
text:answer,
correct:false
});
}


/* Oyunculardan gelen yanlış cevaplar yetmezse
   oyunun kendi yanlış cevaplarını ekle */

for(const extra of shuffle(question.extra||[])){

if(result.length>=MIN_OPTIONS-1) break;

const normalized=normalize(extra);

if(isAnswerCorrect(extra,question)) continue;

if(used.has(normalized)) continue;

used.add(normalized);

result.push({
text:extra,
correct:false
});
}


/* DOĞRU CEVAP MUTLAKA SEÇENEKLERİN İÇİNDE */

result.push({
text:question.correct,
correct:true
});

return shuffle(result);
}

/* Her seçeneğin kimin yazdığı yanlış cevap olduğunu etiketler.
   Bu bilgi seçim sırasında kimseye gösterilmez — sadece tur
   sonunda "Cevaplar Açıklandı" bölümünde kullanılır. */

function attachOwners(options,wrongMap){

options.forEach(opt=>{

if(opt.correct){
opt.owners=[];
return;
}

opt.owners=Object.keys(wrongMap).filter(name=>
wrongMap[name] &&
normalize(wrongMap[name])===normalize(opt.text)
);

});

return options;

}

/* Tur sonunda gösterilen "kim ne yazdı, kim neyi seçti"
   açıklama kutusu. choicesMap: {oyuncuAdı: seçtiği metin} */

function revealHTML(options,choicesMap){

const map=choicesMap||{};

const votersFor=text=>
Object.keys(map).filter(name=>map[name]===text);

const rows=(options||[]).map(opt=>{

const voters=votersFor(opt.text);

let sub;

if(opt.correct){

sub=voters.length>0
?
`<div class="reveal-line reveal-line-mint">🎯 Doğruyu bulanlar: <b>${voters.join(", ")}</b> → her biri +${POINTS_FOR_CORRECT} puan</div>`
:
`<div class="reveal-line">Kimse bulamadı.</div>`;

}else if(opt.owners && opt.owners.length){

sub=
`<div class="reveal-line">✍️ Kim yazdı: <b>${opt.owners.join(", ")}</b></div>`+
(voters.length>0
?
`<div class="reveal-line reveal-line-mint">🗳️ Kim seçti: <b>${voters.join(", ")}</b> → ${opt.owners.join(", ")} +${POINTS_PER_VOTE} puan (oy başına)</div>`
:
`<div class="reveal-line">🗳️ Kimse seçmedi.</div>`);

}else{

sub=
`<div class="reveal-line">🤖 Oyunun eklediği sahte cevaptı.</div>`+
(voters.length>0
?
`<div class="reveal-line">🗳️ Kananlar: <b>${voters.join(", ")}</b> (puan yok)</div>`
:
`<div class="reveal-line">Kimse kanmadı.</div>`);

}

return`

<div class="lb-row reveal-row${opt.correct?" lb-row-truth":""}">

<div style="flex:1">

<div class="reveal-answer-text" style="${opt.correct?"color:var(--mint)":""}">
${opt.correct?"✅ ":""}${opt.text}
</div>

<div class="reveal-sub">
${sub}
</div>

</div>

</div>

`;

}).join("");

return`

<div class="card">

<h3>Cevaplar Açıklandı</h3>

<div class="leaderboard">
${rows}
</div>

</div>

`;

}

/*
  Oda durumu artık gerçek bir Firebase Realtime Database'de
  tutulur, bu yüzden herhangi bir cihazdan yapılan her
  storageSet, aynı odaya bağlı tüm cihazlar tarafından
  storageGet ile okunabilir. Firebase kurulmadıysa (yukarısı
  hâlâ "BURAYA_YAPISTIR" ise) fonksiyonlar null/false döner ve
  arayüz kullanıcıyı uyarır.
*/

let lastStorageError=null;

async function storageGet(key){

if(!firebaseReady) return null;

try{

const snap=await db.ref(key).once("value");

const val=snap.val();

return (val===null||val===undefined)?null:val;

}catch(e){

lastStorageError=(e && (e.code||e.message))||String(e);

console.error("storageGet hatası:",e);

return null;

}

}

async function storageSet(key,value){

if(!firebaseReady) return false;

try{

await db.ref(key).set(value);

return true;

}catch(e){

lastStorageError=(e && (e.code||e.message))||String(e);

console.error("storageSet hatası:",e);

return false;

}

}

/* Bir cevap/seçim gönderimi gibi KRİTİK yazmalar için: arayüz
   zaten "gönderildi" gösterdiğinden, yazma sessizce başarısız
   olursa oyuncu sonsuza kadar (aslında hiçbir şey kaydedilmeden)
   "bekleniyor" ekranında asılı kalır — host da onu asla
   cevaplamış saymaz. Bu yüzden birkaç kez otomatik tekrar
   dener; hepsi başarısız olursa çağıran tarafa false döner ki
   kullanıcıya dürüstçe "gönderilemedi" gösterilip tekrar
   denemesi sağlanabilsin. */
async function storageSetWithRetry(key,value,attempts){

attempts=attempts||3;

for(let i=0;i<attempts;i++){

const ok=await storageSet(key,value);

if(ok) return true;

if(i<attempts-1){
await new Promise(r=>setTimeout(r,800));
}

}

return false;

}

function fbDataToCategories(data){

if(!data) return null;

const arr=Object.keys(data).map(catId=>{

const c=data[catId]||{};

const qMap=c.questions||{};

const questions=Object.keys(qMap).map(qid=>({

q:qMap[qid].q,

correct:qMap[qid].correct,

extra:qMap[qid].extra||[]

}));

return{

id:catId,

name:c.name||catId,

icon:c.icon||"❓",

questions:questions

};

});

return arr;

}

function categoryToFbShape(cat){

const questions={};

cat.questions.forEach((q,i)=>{

const qid="q"+i+"_"+Math.random().toString(36).slice(2,8);

questions[qid]={

q:q.q,

correct:q.correct,

extra:q.extra||[]

};

});

return{ name:cat.name, icon:cat.icon, questions:questions };

}

alert("Firebase ayarlı değil, değişiklikler kalıcı olarak kaydedilemiyor.");

return false;

}

const shaped={};

CATEGORIES.forEach(c=>{

shaped[c.id]=categoryToFbShape(c);

});

return await storageSet("questions_data",shaped);

}

if(!existing){

await saveCategoriesToFirebase();

const arr=fbDataToCategories(existing);

if(arr && arr.length) CATEGORIES=arr;

}

db.ref("questions_data").on("value",snap=>{

const val=snap.val();

const arr=fbDataToCategories(val);

if(arr && arr.length){

CATEGORIES=arr;

if(mode==="admin") renderAdminGame();

let s=(name||"").trim().toLocaleLowerCase("tr-TR");

s=s.replace(/[çğıöşü]/g,ch=>map[ch]||ch);

return s;

async function createOnlineRoom(){

if(onlineActionBusy) return;

if(!firebaseReady){

showOnlineSetupError("Önce Firebase ayarlarını tamamlamalısın (yukarıdaki uyarıya bak).");

return;

}

const name=
(document.getElementById("hostName").value||"").trim();

if(!name){

showOnlineSetupError("Adını gir.");

return;

}

onlineActionBusy=true;

try{

onlineName=name;

roomCode=generateRoomCode();

isHost=true;

hostSelectedCategoryIds=CATEGORIES.map(c=>c.id);

hostQuestionTime=45;

const usedQ={};

CATEGORIES.forEach(c=>{ usedQ[c.id]=[]; });

const room={
phase:"lobby",
host:name,
players:[name],
scores:{[name]:0},
avatars:{[name]:{emoji:pendingAvatarEmoji,color:pendingAvatarColor}},
round:0,
pickerIndex:0,

categoryId:null,
question:null,
options:null,
roundChoices:null
};

roomState=room;

const ok=await storageSet(
"YALANCI_ROOM_"+roomCode,
room);

if(!ok){

roomState=null;

roomCode=null;

isHost=false;

showOnlineSetupError("Oda oluşturulamadı (Firebase'e yazma başarısız oldu). Teknik detay: "+(lastStorageError||"bilinmiyor")+" — Firebase Console > Realtime Database > Rules kısmını kontrol et.");

saveOnlineSession();

startRoomPolling();

async function joinOnlineRoom(){

if(!firebaseReady){

showOnlineSetupError("Önce Firebase ayarlarını tamamlamalısın (yukarıdaki uyarıya bak).");

return;

}

const name=
(document.getElementById("joinName").value||"").trim();

const code=
(document.getElementById("joinCode").value||"")
.trim()
.toUpperCase();

if(!name||!code){

showOnlineSetupError("Ad ve oda kodunu gir.");

return;

}

if(onlineActionBusy) return;

onlineActionBusy=true;

try{

const room=
normalizeRoom(await storageGet(
"YALANCI_ROOM_"+code));

if(!room){

showOnlineSetupError("Oda bulunamadı. Kodu kontrol et.");

return;

}

const isReturningPlayer=room.players.includes(name);

/* Oyun zaten başladıysa, sadece daha önce bu odada olan
   (yani bağlantısı kopmuş / yanlışlıkla çıkmış) bir oyuncunun
   geri dönmesine izin veriyoruz — yeni bir oyuncunun devam
   eden bir oyuna katılması engellenir. */
if(room.phase!=="lobby" && !isReturningPlayer){

showOnlineSetupError("Bu oyun zaten başladı.");

return;

}

if(!isReturningPlayer){

room.players.push(name);

room.scores[name]=0;

room.avatars=room.avatars||{};

room.avatars[name]={emoji:pendingAvatarEmoji,color:pendingAvatarColor};

const ok=await storageSet(
"YALANCI_ROOM_"+code,
room);

if(!ok){

showOnlineSetupError("Odaya katılamadın (Firebase'e yazma başarısız oldu). Teknik detay: "+(lastStorageError||"bilinmiyor")+" — Firebase Console > Realtime Database > Rules kısmını kontrol et.");

return;

}

}

onlineName=name;

roomCode=code;

/* Geri dönen kişi odanın kurucusuysa (host), host yetkisini
   de geri kazanır — yoksa oyun, host'un bağlantısı koptuğu an
   kalıcı olarak askıda kalır (hiçbir istemci faz geçişlerini
   yönetemez). */
isHost=(name===room.host);

roomState=room;

saveOnlineSession();

startRoomPolling();

}finally{

onlineActionBusy=false;

}

}

alert("Oyun başlatılamadı: Firebase'e yazma başarısız oldu. Teknik detay: "+(lastStorageError||"bilinmiyor"));

return;

}

roomState=room;

renderOnlineGame();

}catch(e){

const room=roomState;

const used=(room.usedQuestions||{})[id]||[];

const available=category.questions
.map((q,i)=>i)
.filter(i=>!used.includes(i));

if(!available.length) return;

const index=
available[Math.floor(Math.random()*available.length)];

used.push(index);

room.usedQuestions=room.usedQuestions||{};

room.usedQuestions[id]=used;

room.categoryId=id;

room.question={

isAnswerCorrect(text,roomState.question);

renderOnlineGame();

return;

async function onlineNextRound(){

if(!isHost) return;

if(onlineActionBusy) return;

onlineActionBusy=true;

try{

const room=roomState;

const remaining=CATEGORIES
.filter(c=>(room.selectedCategoryIds||[]).includes(c.id))
.some(
c=>(room.usedQuestions[c.id]||[]).length<c.questions.length
);

if(!remaining || room.round>=TOTAL_ROUNDS){

room.phase="game_over";

await storageSet("YALANCI_ROOM_"+roomCode,room);

roomState=room;

renderOnlineGame();

return;

}

room.round++;

room.pickerIndex=(room.pickerIndex+1)%room.players.length;

room.phase="category_pick";

room.categoryPickStartedAt=Date.now();

await storageSet("YALANCI_ROOM_"+roomCode,room);

roomState=room;

renderOnlineGame();

}catch(e){

console.error("onlineNextRound hatası:",e);

alert("Beklenmeyen bir hata oluştu: "+e.message);

}finally{

onlineActionBusy=false;

}

}

roomCode=null;

isHost=false;

roomState=null;

onlineName="";

onlineLastRound=0;

onlineLocalAnswerStage="idle";

onlineAnswerNotice=false;

onlineMyWrong=null;

onlineLocalSelectStage="idle";

onlineMyChoice=null;

lastRoomSnapshot=null;

clearOnlineSession();

mode=null;

/* =========================================================
   OTURUM HATIRLAMA (bağlantı koparsa geri dönebilmek için)
========================================================= */

/* Bir oyuncu yanlışlıkla sekmeyi kapatır ya da bağlantısı
   koparsa, sayfayı tekrar açtığında kaldığı yerden devam
   edebilsin diye oda kodu ve ismi tarayıcıda saklanır. Bu
   veri sadece bu cihazda kalır, Firebase'e gönderilmez. */

function saveOnlineSession(){

try{

localStorage.setItem(
"yalanci_session",
JSON.stringify({roomCode:roomCode,name:onlineName})
);

}catch(e){

/* localStorage kullanılamıyorsa (gizli sekme, vb.)
   sessizce yoksay — oturum hatırlama devre dışı kalır
   ama oyun normal şekilde çalışmaya devam eder. */

}

}

function clearOnlineSession(){

try{

localStorage.removeItem("yalanci_session");

}catch(e){}

}

async function tryAutoRejoin(){

let saved=null;

try{

saved=JSON.parse(localStorage.getItem("yalanci_session")||"null");

}catch(e){

return false;

}

if(!saved||!saved.roomCode||!saved.name) return false;

const room=
normalizeRoom(await storageGet(
"YALANCI_ROOM_"+saved.roomCode));

/* Oda artık yoksa ya da bu isim odadan çıkarılmışsa
   (örn. oyun çoktan bitmiş ve host yeni bir oda açmış),
   saklı oturumu temizle ve normal ana ekranı göster. */
if(!room||!room.players.includes(saved.name)){

clearOnlineSession();

return false;

}

onlineName=saved.name;

roomCode=saved.roomCode;

isHost=(saved.name===room.host);

roomState=room;

mode="online";

startRoomPolling();

return true;

}


/* =========================================================
   ONLINE POLLING
========================================================= */

function startRoomPolling(){

if(roomPoll){
clearInterval(roomPoll);
}

lastRoomSnapshot=null;

renderOnlineGame();

pollRoom();

roomPoll=setInterval(
pollRoom,
1200
);

}

/*
  Telefon kilitlenince veya uygulama arka plana atılınca
  tarayıcılar setInterval'i yavaşlatır/durdurur — bu yüzden
  ana ekran, ikinci oyuncu katılsa bile bunu göremeyebilir.
  Sekme/telefon tekrar aktif olduğu anda hemen bir kez daha
  sorgu atarak bunu düzeltiyoruz.
*/

let visibilityListenerAdded=false;

if(!visibilityListenerAdded){

document.addEventListener("visibilitychange",()=>{

if(document.visibilityState==="visible" && roomCode){

pollRoom();

}

});

visibilityListenerAdded=true;

}

function copyRoomCode(){

if(!roomCode) return;

const btn=document.getElementById("copyCodeBtn");

function showCopied(){
if(!btn) return;
const original=btn.textContent;
btn.textContent="✅ Kopyalandı!";
setTimeout(()=>{ btn.textContent=original; },1500);
}

if(navigator.clipboard && navigator.clipboard.writeText){

navigator.clipboard.writeText(roomCode)
.then(showCopied)
.catch(()=>{ fallbackCopyRoomCode(); });

}else{

fallbackCopyRoomCode();

}

}

/* Eski tarayıcılar veya izin verilmeyen ortamlar için
   navigator.clipboard çalışmazsa bu yedek yöntem kullanılır. */
function fallbackCopyRoomCode(){

const temp=document.createElement("textarea");

temp.value=roomCode;

temp.style.position="fixed";

temp.style.opacity="0";

document.body.appendChild(temp);

temp.focus();

temp.select();

try{

document.execCommand("copy");

const btn=document.getElementById("copyCodeBtn");

if(btn){
const original=btn.textContent;
btn.textContent="✅ Kopyalandı!";
setTimeout(()=>{ btn.textContent=original; },1500);
}

}catch(e){

alert("Kod kopyalanamadı, elle yazman gerekebilir: "+roomCode);

}

document.body.removeChild(temp);

}

function manualRefreshRoom(){

if(roomCode){

pollRoom();

}

}

async function pollRoom(){

if(!roomCode) return;

const room=
normalizeRoom(await storageGet(
"YALANCI_ROOM_"+roomCode));

if(!room) return;

roomState=room;

onlinePlayers=room.players||[];

onlineScores=room.scores||{};

if(room.round!==onlineLastRound){

onlineLastRound=room.round;

onlineLocalAnswerStage="idle";
onlineAnswerNotice=false;
onlineMyWrong=null;
onlineLocalSelectStage="idle";
onlineMyChoice=null;

}

if(isHost){

try{

await hostMaybeAdvance();

}catch(e){

/* Beklenmeyen bir hata tüm yoklama döngüsünü
   durdurmasın — bir sonraki yoklamada (1.2 sn sonra)
   tekrar denenecek. */
console.error("hostMaybeAdvance hatası:",e);

}

}

let justEntered=false;

if(roomState.phase==="answering" && onlineLocalAnswerStage==="idle"){

onlineLocalAnswerStage="attempt1";

justEntered=true;

}

if(roomState.phase==="select" && onlineLocalSelectStage==="idle"){

onlineLocalSelectStage="selecting";

justEntered=true;

}

const stageBusy=
onlineLocalAnswerStage==="attempt1";

const snapshot=JSON.stringify({

r:roomState,

a:onlineLocalAnswerStage,

s:onlineLocalSelectStage

});

const changed=snapshot!==lastRoomSnapshot;

if(justEntered || (!stageBusy && changed)){

renderOnlineGame();

lastRoomSnapshot=snapshot;

}

if(justEntered && roomState.phase==="answering"){

/* ÖNEMLİ: kalan süreyi ASLA başka bir cihazın (host'un)
   yazdığı zaman damgasıyla bu cihazın kendi saatini
   karşılaştırarak hesaplama — telefonların saatleri birbirini
   tutmayabilir (senkronize değildir), bu da bazı oyuncuların
   neredeyse hiç süresi kalmamış gibi görünmesine yol açar.
   Bunun yerine her cihaz, o aşamaya girdiği an kendi tam
   süresini yerel olarak başlatır. Süre aşımı güvenliği zaten
   host'un kendi saatiyle kendi yazdığı zaman damgasını
   karşılaştırdığı hostMaybeAdvance() içinde ayrıca sağlanıyor. */
startTimer(roomState.questionTime||45,()=>onlineSubmitAnswer(""));

}

if(justEntered && roomState.phase==="select"){

startTimer(roomState.questionTime||45,()=>onlineChooseAnswer(""));

}

if(roomState.phase==="category_pick" &&
onlineCategoryTimerRound!==roomState.round){

onlineCategoryTimerRound=roomState.round;

/* Bu sayaç sadece görsel — gerçek zaman aşımı güvenliği
   host tarafında hostMaybeAdvance() içinde (host'un kendi
   saatiyle) yönetiliyor, bu yüzden süre dolduğunda burada
   ekstra bir işlem yapmıyoruz (host otomatik olarak devam
   ettirecek). */
startTimer(roomState.questionTime||45,()=>{});

}

/* Oyun bittiyse (herkes "Oyun Bitti!" ekranını gördü), artık
   round/faz değişecek bir şey kalmadığından yoklamayı
   durduruyoruz — boşuna pil/veri tüketmesin. Kullanıcı "Ana
   Menü"ye basınca zaten leaveOnlineRoom() ayrıca temizler;
   bu sadece erken, gereksiz yoklamaları önler. */
if(roomState.phase==="game_over" && roomPoll){

clearInterval(roomPoll);

roomPoll=null;

}

}

async function hostMaybeAdvance(){

const room=roomState;

if(!room) return;

/* Bir oyuncu bir sebeple hiç cevap/seçim göndermezse
   (uygulamayı kapattı, bağlantısı koptu, vb.) oyun sonsuza
   kadar onu beklemesin diye bir üst zaman sınırı koyuyoruz.
   Süre dolunca, cevap vermeyenler o turda "cevapsız" kabul
   edilip oyun devam eder. */

const qTime=room.questionTime||45;

/* Ağ gecikmesi için küçük bir tolerans payı — ama görünür
   sayaç sıfırlandıktan sonra oyuncuyu "askıda" hissettirecek
   kadar uzun değil. */
const ANSWER_PHASE_TIMEOUT_MS=(qTime+5)*1000;

const SELECT_PHASE_TIMEOUT_MS=(qTime+5)*1000;

const CATEGORY_PICK_TIMEOUT_MS=(qTime+5)*1000;

/* Sıradaki oyuncu kategori seçmeden süre dolarsa (uygulamayı
   kapattı, bağlantısı koptu, vb.), oyun sonsuza kadar onu
   beklemesin diye host adına rastgele bir kategori seçilir —
   tıpkı Elden Ele modundaki otomatik seçim gibi. */
if(room.phase==="category_pick"){

const timedOut=
room.categoryPickStartedAt &&
(Date.now()-room.categoryPickStartedAt>CATEGORY_PICK_TIMEOUT_MS);

if(timedOut){

const available=CATEGORIES.filter(c=>
(room.selectedCategoryIds||[]).includes(c.id) &&
c.questions.length-((room.usedQuestions||{})[c.id]||[]).length>0
);

if(!available.length){

room.phase="game_over";

await storageSet("YALANCI_ROOM_"+roomCode,room);

roomState=room;

return;

}

const pick=available[Math.floor(Math.random()*available.length)];

const used=(room.usedQuestions||{})[pick.id]||[];

const idxAvailable=pick.questions
.map((q,i)=>i)
.filter(i=>!used.includes(i));

const index=
idxAvailable[Math.floor(Math.random()*idxAvailable.length)];

used.push(index);

room.usedQuestions=room.usedQuestions||{};

room.usedQuestions[pick.id]=used;

room.categoryId=pick.id;

room.question={
...pick.questions[index],
categoryName:pick.name
};

room.options=null;

room.roundChoices=null;

room.phase="answering";

room.answeringStartedAt=Date.now();

await storageSet("YALANCI_ROOM_"+roomCode,room);

roomState=room;

}

}

if(room.phase==="answering"){

const wrongMap={};

let allIn=true;

for(const name of room.players){

try{

const a=await storageGet(
roomKey(roomCode,"ans",room.round,name));

if(a){
wrongMap[name]=a.wrong;
}else{
allIn=false;
}

}catch(e){

/* Geçici bir okuma hatası tüm kontrolü durdurmasın —
   bu oyuncu henüz cevaplamamış say, bir sonraki
   yoklamada (1.2 sn sonra) tekrar denenecek. */
allIn=false;

}

}

const timedOut=
(()=>{

const key=roomCode+":"+room.round;

if(hostAnsweringTrackKey!==key){
hostAnsweringTrackKey=key;
hostAnsweringObservedAt=Date.now();
}

return (Date.now()-hostAnsweringObservedAt)>ANSWER_PHASE_TIMEOUT_MS;

})();

if(allIn||timedOut){

room.players.forEach(name=>{
if(!(name in wrongMap)) wrongMap[name]=null;
});

room.options=attachOwners(
buildOptions(room.question,Object.values(wrongMap)),
wrongMap
);

room.phase="select";

room.selectStartedAt=Date.now();

await storageSet("YALANCI_ROOM_"+roomCode,room);

roomState=room;

}

}else if(room.phase==="select"){

const choiceMap={};

let allIn=true;

for(const name of room.players){

try{

const c=await storageGet(
roomKey(roomCode,"cho",room.round,name));

if(c){
choiceMap[name]=c.choice;
}else{
allIn=false;
}

}catch(e){

allIn=false;

}

}

const timedOut=
room.selectStartedAt &&
(Date.now()-room.selectStartedAt>SELECT_PHASE_TIMEOUT_MS);

if(allIn||timedOut){

const gains={};

room.players.forEach(name=>{

const choiceText=choiceMap[name];

if(choiceText===undefined) return; // hiç seçim yapmadı, puan yok

const opt=(room.options||[]).find(o=>o.text===choiceText);

if(!opt) return;

if(opt.correct){

room.scores[name]=(room.scores[name]||0)+POINTS_FOR_CORRECT;

gains[name]=(gains[name]||0)+POINTS_FOR_CORRECT;

}else if(opt.owners && opt.owners.length){

opt.owners.forEach(owner=>{

if(owner!==name){
room.scores[owner]=(room.scores[owner]||0)+POINTS_PER_VOTE;
gains[owner]=(gains[owner]||0)+POINTS_PER_VOTE;
}

});

}

});

room.roundChoices=choiceMap;

room.lastGain=gains;

room.phase="round_result";

await storageSet("YALANCI_ROOM_"+roomCode,room);

roomState=room;

}

}

}

   AUTO JOIN FROM QR
========================================================= */

function checkRoomFromURL(){

const params=
new URLSearchParams(
window.location.search
);

const room=params.get("room");

if(!room) return;

mode="online";

/* cameFromShareLink: bu ekranın QR/oda-linkiyle mi açıldığını
   işaretler — "Oda Oluştur" kartı bu durumda gizlenir, çünkü
   linkle gelen kişi zaten katılmak istiyordur. */
cameFromShareLink=true;

onlineSetupJoinCode=room.toUpperCase();

setTimeout(()=>{

renderOnlineSetup();

const nameField=document.getElementById("joinName");

if(nameField) nameField.focus();

},0);

}


/* =========================================================
   INIT
========================================================= */

render();

checkRoomFromURL();

initQuestionBank();

/* Sayfa yeniden açıldığında, daha önce bir online odaya
   katılmışsa (bağlantı koptu, sekme kapandı, vb.) otomatik
   olarak kaldığı yerden devam etmeyi dener. QR koddan gelen
   taze bir katılma isteği varsa (?room=...), buna öncelik
   verilir ve otomatik geri dönme denenmez. */
if(firebaseReady && !new URLSearchParams(window.location.search).get("room")){

tryAutoRejoin();

}
